name: Deploy to GitHub Pages

# 每次推送到 main 就自动把仓库根目录发布为 Pages 站点。
# 这样你本地改完 index.html / styles.css / assets/ 后只要 git push，站点自动更新，
# 不需要再去 Settings → Pages 手动点。

on:
  push:
    branches: [main]
  workflow_dispatch:      # 也支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
